# Include once from nginx http context, before the Pinax server block.
# Read-only requests (including video polling) do not consume the write budget.
map $request_method $pinax_write_ip {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $pinax_write_ip zone=pinax_writes:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=pinax_connections:10m;

# In location /api/ (see the server-version production adapter):
# limit_req zone=pinax_writes burst=30 nodelay;
# limit_req_status 429;
# limit_conn pinax_connections 8;
# limit_conn_status 429;
# include /etc/aa_nginx/pinax-proxy-secret.conf;
# The private include sets X-Pinax-Proxy-Token to PINAX_PROXY_SECRET.
# Generate the token on the server; never commit it or expose it to the client.
