# Pinax nginx site — production build served from dist/, API/WS/docs proxied to Express (3001).
# The host cannot run `vite build` (1.8GB RAM, rollup OOM), so dist/ is built
# locally and uploaded. Vite dev server is no longer needed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/pinax;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # User manual (markdown 静态目录 by Express). Goes directly to backend.
    location /docs/user-manual/ {
        proxy_pass http://172.18.0.12:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API. Use external IPv4 — this kernel refuses loopback to 0.0.0.0:3001.
    location /api/ {
        proxy_pass http://172.18.0.12:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # WebSocket relay (collaboration / streaming).
    location /ws/ {
        proxy_pass http://172.18.0.12:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Hashed assets — immutable, long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for Vue Router history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
