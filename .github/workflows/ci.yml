name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：供 PR/push 显式取基准，避免无参数 git diff --check 什么也没检查
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && ! [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            MERGE_BASE=""
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              MERGE_BASE=$(git merge-base "$BEFORE" "$SHA" || true)
            fi

            if [ -n "$MERGE_BASE" ]; then
              echo "range=${MERGE_BASE}...${SHA}" >> "$GITHUB_OUTPUT"
            else
              FIRST_PUSH_COMMIT=$(node -e "const event = require(process.env.GITHUB_EVENT_PATH); process.stdout.write(event.commits?.[0]?.id || '')")
              if [ -n "$FIRST_PUSH_COMMIT" ] && git cat-file -e "${FIRST_PUSH_COMMIT}^" 2>/dev/null; then
                echo "range=${FIRST_PUSH_COMMIT}^...${SHA}" >> "$GITHUB_OUTPUT"
                echo "note=push 前序提交不可比较，改用本次 push 首提交之父作为基准" >> "$GITHUB_STEP_SUMMARY"
              else
                EMPTY_TREE=$(git hash-object -t tree /dev/null)
                echo "range=${EMPTY_TREE}..HEAD" >> "$GITHUB_OUTPUT"
                echo "note=无法解析 push 基准，改为空树→HEAD 全树检查" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            # 首次 push 等无基准事件：与空树比较，得到可解释的全树空白错误检查
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            echo "range=${EMPTY_TREE}..HEAD" >> "$GITHUB_OUTPUT"
            echo "note=无 push 基准，改为空树→HEAD 全树检查" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Whitespace check (base to HEAD)
        run: |
          echo "运行范围: ${{ steps.base.outputs.range }}"
          git diff --check "${{ steps.base.outputs.range }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint delta gate
        run: npm run lint:delta

      - name: Run tests
        run: npm run verify:contract

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
      - name: Authoring build-size gate
        run: npm run architecture:build-size
      - name: Architecture structure gate
        run: npm run architecture:check
      - name: Build documentation
        run: npm run docs:build

  authoring-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        journey: [authoring, workspace-backup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 无密钥作者主路径：欢迎页→诊断导出→导入合成稿→刷新→隐私合同；
      # 网络守卫拦截一切非本机请求，出现任何 provider 外发即失败。
      - name: Run authoring smoke (no model key)
        if: matrix.journey == 'authoring'
        run: node scripts/ci/authoring-smoke.mjs
        env:
          SMOKE_OUT_DIR: smoke-artifacts

      - name: Run workspace backup smoke (no model key)
        if: matrix.journey == 'workspace-backup'
        run: npm run ci:workspace-backup-smoke
        env:
          BACKUP_CHECK_OUT_DIR: backup-smoke-artifacts

      - name: Upload failure artifacts
        if: failure() && matrix.journey == 'authoring'
        uses: actions/upload-artifact@v4
        with:
          name: authoring-smoke-artifacts
          path: smoke-artifacts/
          retention-days: 7

      - name: Upload backup failure artifacts
        if: failure() && matrix.journey == 'workspace-backup'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-backup-smoke-artifacts
          path: backup-smoke-artifacts/
          retention-days: 7
